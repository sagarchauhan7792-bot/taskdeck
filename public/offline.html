<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Taskdeck · Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0c10; color: #eceef2;
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { width: 56px; height: 56px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 24px; color: #8d92a1; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 22px; background: #c8f53c; color: #10130a; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Taskdeck needs a connection to load your tasks.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
